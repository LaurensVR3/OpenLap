name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # Never publish a release the test suite fails on.
  tests:
    uses: ./.github/workflows/test.yml

  build-windows:
    needs: tests
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Install from pyproject.toml, never from a list kept here: this
      # workflow used to keep its own, which drifted and shipped every
      # release through 0.3.3 without scipy (auto-sync) or requests
      # (RaceBox cloud download). The racebox-download extra also pins the
      # Playwright version whose Chromium revision the exe bundles.
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[racebox-download]" pyinstaller
        shell: pwsh

      - name: Check runtime dependencies are installed
        run: python scripts/check_build_deps.py --extra racebox-download
        shell: pwsh

      - name: Install Playwright Chromium
        run: playwright install chromium
        shell: pwsh

      - name: Install ffmpeg
        run: |
          choco install ffmpeg -y --no-progress
          # Copy the real binaries next to the spec so PyInstaller bundles
          # them. NOT (Get-Command ffmpeg).Source: that is Chocolatey's
          # ~390 KB shim in choco\bin, which only forwards to the real exe
          # and cannot run once copied. Every release through 0.3.3 shipped
          # those shims instead of FFmpeg.
          foreach ($tool in 'ffmpeg', 'ffprobe') {
            $real = Get-ChildItem "$env:ChocolateyInstall\lib\ffmpeg" -Recurse -Filter "$tool.exe" |
                    Sort-Object Length -Descending | Select-Object -First 1
            if (-not $real -or $real.Length -lt 10MB) { throw "Real $tool.exe not found (got $($real.FullName), $($real.Length) bytes)" }
            Copy-Item $real.FullName -Destination "${{ github.workspace }}\$tool.exe"
            & "${{ github.workspace }}\$tool.exe" -hide_banner -version | Select-Object -First 1
            if ($LASTEXITCODE -ne 0) { throw "Copied $tool.exe does not run" }
          }
        shell: pwsh

      - name: Build exe
        run: pyinstaller OpenLap.spec --clean -y
        shell: pwsh

      # Runs the packaged exe's --self-test: imports every OpenLap module,
      # style plugin and runtime dependency inside the frozen build, and
      # checks FFmpeg shipped with it. The build step above succeeds even
      # when a package is missing, so this is what actually catches it.
      - name: Smoke test packaged build
        run: python scripts/smoke_test_build.py --extra racebox-download -- dist\OpenLap\OpenLap.exe
        shell: pwsh

      - name: Zip release
        run: Compress-Archive -Path dist\OpenLap\* -DestinationPath OpenLap-${{ github.ref_name }}-windows.zip
        shell: pwsh

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
        shell: pwsh

      - name: Build installer
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$version installer\OpenLap.iss
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            OpenLap-${{ github.ref_name }}-windows.zip
            installer\Output\OpenLap-Setup-*.exe
          generate_release_notes: true
