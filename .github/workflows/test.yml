name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs this before building, so a failing suite blocks a release.
  workflow_call:

jobs:
  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is what the release ships on; Linux keeps the
        # cross-platform code paths (libxrk, non-Windows ffmpeg lookup) honest.
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # The export tests render real video end to end through FFmpeg; without
      # it they skip, so install it rather than let them silently not run.
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest tests/ -q

      # Imports every OpenLap module and style plugin from source, catching a
      # module that no longer imports on this platform even if no test
      # exercises it. The packaged build gets the same check in release.yml.
      - name: Import smoke test (source)
        run: python scripts/smoke_test_build.py -- python main.py

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm run test:run
